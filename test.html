<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAF8F4; --navy:#14213D; --ink:#1A1A1A; --red:#C8102E;
  --grey:#6E6E6E; --line:#E2DCD0; --soft:#F1ECE3; --card:#FFFFFF;
}
body{font-family:'Lato',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;line-height:1.6;font-size:17px}
.cond{font-family:'Roboto Condensed','Arial Narrow',sans-serif;font-weight:700;
  text-transform:uppercase;line-height:1.04;color:var(--navy);letter-spacing:.2px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 60px}

/* CABECERA */
header{padding:20px 0 6px}
header .inner{max-width:560px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px}
header img{height:34px;width:auto;display:block}
header .nom{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:13px;letter-spacing:1.4px;color:var(--navy)}

/* CHIP */
.chip{display:inline-block;background:var(--red);color:#fff;font-family:'Roboto Condensed',sans-serif;
  font-weight:700;text-transform:uppercase;letter-spacing:1.6px;font-size:11.5px;padding:6px 12px 5px}

/* PROGRESO */
.prog{display:flex;gap:5px;margin:18px 0 22px}
.prog i{flex:1;height:4px;background:var(--line);display:block}
.prog i.on{background:var(--red)}

/* PANTALLAS */
.scr{display:none}
.scr.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font-size:clamp(28px,7vw,38px);margin:14px 0 12px}
h2.q{font-size:clamp(21px,5vw,26px);margin:0 0 4px}
.sub{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  color:var(--red);font-size:15px;letter-spacing:.4px;margin-bottom:4px}
.rule{height:3px;background:var(--red);margin:14px 0 18px;max-width:100%}
.lead{font-size:17px;max-width:60ch}
.lead strong{color:var(--navy)}

/* SITUACIÓN */
.sit{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);
  padding:18px 20px;margin:16px 0 20px;border-radius:0 14px 14px 0;font-size:17px;line-height:1.55}
.sit b{color:var(--red);font-weight:700}
.tudec{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:1.6px;font-size:12.5px;color:var(--navy);margin-bottom:10px;display:block}

/* OPCIONES */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;font-family:'Lato',sans-serif;font-size:16.2px;
  line-height:1.5;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--navy)}
.opt:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.opt.sel{border-color:var(--navy);background:var(--soft);font-weight:700;color:var(--navy)}
.opt.hide{display:none}

/* CONSECUENCIA */
.after{background:var(--soft);border-left:4px solid var(--grey);padding:16px 18px;
  margin:18px 0 0;border-radius:0 12px 12px 0;display:none}
.after.on{display:block;animation:fade .25s ease-out}
.after .k{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:1.6px;font-size:12px;color:var(--navy);margin-bottom:6px}
.after p{font-size:16px;line-height:1.55}

/* BOTONES */
.btn{display:block;width:100%;min-height:56px;background:var(--red);color:#fff;border:none;
  font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:1.2px;font-size:17px;cursor:pointer;border-radius:12px;margin-top:18px;
  padding:16px 18px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.pie{font-size:13.5px;color:var(--grey);margin-top:16px}

/* FORMULARIO */
.card{background:var(--navy);border-top:4px solid var(--red);padding:24px 22px 22px;
  box-shadow:0 20px 44px rgba(20,33,61,.24);border-radius:0 0 14px 14px;margin-top:18px}
.card h3{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  color:#fff;font-size:22px;line-height:1.08;margin-bottom:8px}
.card p{font-size:14.6px;color:rgba(250,248,244,.86);margin-bottom:16px}
.card input[type=text],.card input[type=email]{width:100%;padding:15px 14px;border:none;
  border-radius:10px;font-family:'Lato',sans-serif;font-size:16.5px;margin-bottom:11px;color:var(--ink)}
.card label.cons{display:flex;gap:10px;align-items:flex-start;font-size:13.4px;
  color:rgba(250,248,244,.86);margin:4px 0 4px;cursor:pointer;line-height:1.45}
.card label.cons input{margin-top:3px;flex-shrink:0;width:17px;height:17px}
.card label.cons a{color:#fff;text-decoration:underline}
.micro{font-size:12.8px;color:rgba(250,248,244,.6);margin-top:12px;text-align:center}
.err{background:#fff;color:var(--red);font-size:14px;padding:10px 12px;border-radius:9px;
  margin-bottom:10px;display:none;font-weight:700}
.err.on{display:block}

/* RESULTADO */
.score{font-family:'Roboto Condensed',sans-serif;font-weight:700;color:var(--red);
  font-size:clamp(40px,11vw,60px);line-height:1;margin-bottom:2px}
.score small{font-size:.45em;color:var(--grey)}
.pname{font-size:clamp(25px,6.4vw,34px);margin-bottom:12px}
.diag{font-size:17.5px;font-weight:700;color:var(--navy);margin-bottom:22px;line-height:1.5}
.sec{margin-bottom:22px}
.sec .k{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:1.6px;font-size:12.5px;color:var(--navy);margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.sec .k::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--navy);flex-shrink:0}
.sec.good .k::before{background:#2E7D4F}
.sec.bad .k::before{background:var(--red)}
.sec p{font-size:16.4px;line-height:1.55;margin-bottom:9px}
.cont{border-top:2px solid var(--navy);padding-top:14px}
.cont div{margin-bottom:11px;font-size:16.2px;line-height:1.5}
.cont b{font-family:'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px;
  font-size:13px;color:var(--red);display:block;margin-bottom:2px}
.close{background:var(--navy);color:#fff;padding:22px 22px;border-radius:14px;margin-top:24px}
.close p{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:19px;line-height:1.14;margin-bottom:8px}
.close span{font-size:13.6px;color:rgba(250,248,244,.75)}
.sent{font-size:14.6px;color:var(--grey);margin-top:16px;text-align:center}
.oferta{border-top:2px solid var(--navy);margin-top:26px;padding-top:18px}
.oferta .k{font-family:'Roboto Condensed',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:1.6px;font-size:12.5px;color:var(--red);margin-bottom:8px}
.oferta p{font-size:16.2px;line-height:1.55}
.oferta .btn{text-align:center;text-decoration:none;line-height:1.3;
  display:flex;align-items:center;justify-content:center}
</style>
</head>

    <div class="opts" id="opts"></div>
  </div>`;
  const c=document.getElementById('opts');
  ROLES.forEach(([t,d,v])=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button';
    b.innerHTML = '<strong>'+t+'</strong>' + (d?'<br><span style="color:var(--grey);font-size:15px">'+d+'</span>':'');
    b.onclick=()=>{rol=v;paso=1;render()};
    c.appendChild(b);
  });
}

function pantallaSit(i){
  const s = SITS[i];
  app.innerHTML = `
  <div class="scr on">
    <span class="chip">${s.et}</span>
    <div class="sit">${s.sit}</div>
    <span class="tudec">Tu decisión</span>
    <div class="opts" id="opts"></div>
    <div class="after" id="after"><div class="k">Lo que pasa después</div><p id="afterTxt"></p></div>
    <button class="btn" id="next" style="display:none">Siguiente</button>
  </div>`;
  const c=document.getElementById('opts');
  s.op.forEach(([txt,tag,cons],idx)=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button'; b.textContent=txt;
    b.onclick=()=>{
      respuestas[i]={tag:tag,eje:s.eje};
      [...c.children].forEach((o,j)=>{ if(j!==idx) o.classList.add('hide'); });
      b.classList.add('sel');
      document.getElementById('afterTxt').textContent=cons;
      document.getElementById('after').classList.add('on');
      const n=document.getElementById('next');
      n.style.display='block';
      n.onclick=()=>{paso++;render()};
      n.scrollIntoView({behavior:'smooth',block:'center'});
    };
    c.appendChild(b);
  });
}

/* ============ CÁLCULO ============ */
function calcula(){
  const pts = {C:4,CpP:2,CpA:2,P:0,A:0};
  let total=0, cC=0,cP=0,cA=0;
  const ejePts={}; ORDEN_EJES.forEach(k=>ejePts[k]=0);
  respuestas.forEach(r=>{
    const p=pts[r.tag]; total+=p; ejePts[r.eje]+=p;
    if(r.tag==='C') cC++;
    else if(r.tag==='P'||r.tag==='CpP') cP++;
    else cA++;
  });
  const punt = Math.round(total/32*100);
  let perfil;
  if(punt>=75) perfil='bisagra';
  else if(cP>cA) perfil='sostiene_todo';
  else if(cA>cP) perfil='controla_todo';
  else perfil='sostiene_todo';

  const pct = ORDEN_EJES.map(k=>({k:k,v:ejePts[k]/EJES[k].max}));
  const ordDesc=[...pct].sort((a,b)=>b.v-a.v);
  const fuerte = ordDesc[0];
  const ordAsc=[...pct].sort((a,b)=>a.v-b.v).filter(e=>e.k!==fuerte.k);
  let des = ordAsc.filter(e=>e.v<0.75).slice(0,2);
  if(des.length===0) des=[ordAsc[0]];
  return {punt:punt, perfil:perfil, fuerte:fuerte, des:des};
}

let enviado=false;
async function envia(){
  const nm=document.getElementById('nm').value.trim();
  const em=document.getElementById('em').value.trim();
  const ck=document.getElementById('ck').checked;
  const err=document.getElementById('err');
  const muestra=t=>{err.textContent=t;err.classList.add('on')};
  if(!nm) return muestra('Escribe tu nombre.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return muestra('Revisa el correo.');
  if(!ck) return muestra('Marca la casilla para poder enviártelo.');
  err.classList.remove('on');
  const b=document.getElementById('send');
  b.disabled=true; b.textContent='Enviando…';

  const r=calcula();
  const fd=new FormData();
  fd.append('fields[email]',em);
  fd.append('fields[name]',nm);
  fd.append('fields[rol]',rol);
  fd.append('fields[perfil]',r.perfil);
  fd.append('fields[puntuacion]',String(r.punt));
  fd.append('fields[eje_fuerte]',EJES[r.fuerte.k].fuerte);
  fd.append('fields[ejes_desarrollo]',r.des.map(e=>EJES[e.k].des).join(' · '));
  fd.append('fields[origen]','test_mando');
  fd.append('ml-submit','1');
  fd.append('anticsrf','true');

  const fid=ML_FORMS[r.perfil];
  try{
    await fetch('https://assets.mailerlite.com/jsonp/'+ML_ACCOUNT+'/forms/'+fid+'/subscribe',
      {method:'POST',body:fd});
    enviado=true;
  }catch(e){ enviado=false; }
  paso=10; render(r);
}

      <a class="btn" href="mailto:info@manejandoelriesgo.es?subject=Formaci%C3%B3n%20-%20resultado%20del%20test">info@manejandoelriesgo.es</a>
    </div>` : `
    <div class="oferta">
      <div class="k">Tu caso</div>
      <p>Esto son seis situaciones inventadas. Si la tuya no está aquí, mándamela y la contesto en vídeo.</p>
      <a class="btn ghost" href="/pregunta">Contarme mi situación</a>

/* ============ ROUTER ============ */
function render(r){
  window.scrollTo({top:0,behavior:'instant'});
  pintaProg();
  if(paso===-1) return portada();
  if(paso===0)  return pantallaRol();
  if(paso>=1 && paso<=8) return pantallaSit(paso-1);
  if(paso===9)  return pantallaForm();
  return pantallaResultado(r);
}
// permite abrir una pantalla concreta para revisarla: test.html#p=0
const _m = /p=(-?\d+)/.exec(location.hash);
if(_m) paso = parseInt(_m[1],10);
render();
</script>
